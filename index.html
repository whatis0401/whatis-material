// ─── 工具函式 ───────────────────────────────────────────────
async function sheetGet(sheetName) {
  const r = await fetch(`${GAS_URL}?sheet=${encodeURIComponent(sheetName)}`);
  return r.json();
}

async function sheetPut(sheetName, values) {
  const r = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ sheet: sheetName, values }),
  });
  return r.json();
}

async function uploadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const base64 = e.target.result.split(",")[1];
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "uploadImage",
            base64,
            fileName: `mat_${Date.now()}_${file.name}`,
            mimeType: file.type,
          }),
        });
        resolve(await res.json());
      } catch (err) {
        reject(err);
      }
    };
    reader.readAsDataURL(file);
  });
}

async function deleteImage(fileId) {
  const r = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "deleteImage", fileId }),
  });
  return r.json();
}

function rowsToTypes(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).filter((r) => r[0]).map((r) => ({
    code: r[0] || "",
    name: r[1] || "",
    active: r[2] === "TRUE",
  }));
}

function typesToRows(types) {
  const h = ["code", "name", "active"];
  return [h, ...types.map((t) => [t.code, t.name, t.active ? "TRUE" : "FALSE"])];
}

function rowsToMembers(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).filter((r) => r[0]).map((r) => ({
    name: r[0] || "",
    active: r[1] === "TRUE",
  }));
}

function membersToRows(members) {
  const h = ["name", "active"];
  return [h, ...members.map((m) => [m.name, m.active ? "TRUE" : "FALSE"])];
}

function rowsToMaterials(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).filter((r) => r[0]).map((r) => {
    let image = null;
    try {
      const parsed = JSON.parse(r[8]);
      image = parsed && parsed.fileId ? parsed : null;
    } catch (e) {
      image = null;
    }
    return {
      id: r[0] || "",
      typeCode: r[1] || "",
      number: r[2] || "",
      year: r[3] || "",
      name: r[4] || "",
      status: r[5] || "上架",
      vendor: r[6] || "",
      spec: r[7] || "",
      image,
      note: r[9] || "",
      createdBy: r[10] || "",
      updatedBy: r[11] || "",
      updatedAt: r[12] || "",
      subCode: r[13] || "",
      project: r[14] || "",
    };
  });
}

function materialsToRows(materials) {
  const h = ["id","typeCode","number","year","name","status","vendor","spec","image","note","createdBy","updatedBy","updatedAt","subCode","project"];
  return [
    h,
    ...materials.map((m) => [
      m.id,
      m.typeCode,
      m.number,
      m.year,
      m.name,
      m.status,
      m.vendor,
      m.spec,
      m.image ? JSON.stringify(m.image) : "",
      m.note,
      m.createdBy,
      m.updatedBy,
      m.updatedAt,
      m.subCode || "",
      m.project || "",
    ]),
  ];
}

function rowsToVendors(rows) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).filter((r) => r[0]).map((r) => ({
    id: r[0] || "",
    type: r[1] || "",
    name: r[2] || "",
    contact: r[3] || "",
    phone: r[4] || "",
    address: r[5] || "",
    email: r[6] || "",
    line: r[7] || "",
    note: r[8] || "",
  }));
}

function vendorsToRows(vendors) {
  const h = ["id","type","name","contact","phone","address","email","line","note"];
  return [h, ...vendors.map((v) => [v.id, v.type, v.name, v.contact, v.phone, v.address, v.email, v.line, v.note])];
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function nextNumber(typeCode, subCode, materials) {
  const existing = materials
    .filter((m) => m.typeCode === typeCode && (m.subCode || "") === (subCode || ""))
    .map((m) => {
      const parts = m.number.split("-");
      const n = parseInt(parts[parts.length - 1], 10);
      return isNaN(n) ? 0 : n;
    });
  const max = existing.length ? Math.max(...existing) : 0;
  return String(max + 1).padStart(3, "0");
}

function buildNumber(typeCode, subCode, num) {
  if (subCode && subCode.trim()) {
    return `${typeCode}-${subCode.trim().toUpperCase()}-${num}`;
  }
  return `${typeCode}-${num}`;
}

function suggestCode(typeName) {
  if (!typeName) return "";
  const map = {
    木: "WD", 皮: "WD-V", 實木: "WD-S", 科技: "TW", 玻璃: "GL",
    磚: "TL", 磁磚: "TL", 石: "ST", 大理石: "ST-M", 布: "FB",
    金屬: "MT", 鐵: "MT-I", 鋁: "MT-A", 塑: "PL", 油漆: "PT",
  };
  for (const [key, val] of Object.entries(map)) {
    if (typeName.includes(key)) return val;
  }
  const initials = typeName
    .split("")
    .slice(0, 2)
    .map((c) => c.charCodeAt(0).toString(16).toUpperCase().slice(0, 1))
    .join("");
  return initials || "XX";
}

// ─── 圖片燈箱 ────────────────────────────────────────────────
function LightBox({ image, onClose }) {
  if (!image) return null;
  // 使用較大的 thumbnail（w1600）顯示，避免 CORS 問題
  const displayUrl = image.fileId
    ? `https://drive.google.com/thumbnail?id=${image.fileId}&sz=w1600`
    : image.thumbUrl || image.viewUrl;
  const downloadUrl = image.fileId
    ? `https://drive.google.com/uc?export=download&id=${image.fileId}`
    : image.viewUrl;
  return (
    <div style={s.modal} onClick={onClose}>
      <div
        style={{ maxWidth: "88vw", maxHeight: "88vh", position: "relative", background: "#fff", borderRadius: 6, padding: 12 }}

// ─── 主 App ──────────────────────────────────────────────────
function App() {
  const [themeKey, setThemeKey] = React.useState(() => localStorage.getItem("wd-mat-theme") || "default");
  const theme = THEMES[themeKey] || THEMES.default;

  // 覆蓋 G 用 theme
  Object.assign(G, theme);

  const [loading, setLoading] = React.useState(true);
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");

  const [materials, setMaterials] = React.useState([]);
  const [types, setTypes] = React.useState([]);
  const [members, setMembers] = React.useState([]);
  const [vendors, setVendors] = React.useState([]);

  const [currentUser, setCurrentUser] = React.useState(null);
  const [activeTab, setActiveTab] = React.useState("__all__");
  const [activePage, setActivePage] = React.useState("materials"); // materials | vendors

  // modal states
  const [lightboxImage, setLightboxImage] = React.useState(null);
  const [editMaterial, setEditMaterial] = React.useState(null);
  const [editType, setEditType] = React.useState(null);
  const [showTypeManager, setShowTypeManager] = React.useState(false);
  const [showMemberManager, setShowMemberManager] = React.useState(false);
  const [showSettings, setShowSettings] = React.useState(false);
  const [editVendor, setEditVendor] = React.useState(null);
  const [adminModal, setAdminModal] = React.useState(null);
  const [adminPw, setAdminPw] = React.useState("");
  const [adminError, setAdminError] = React.useState("");

  // filter / search
  const [searchText, setSearchText] = React.useState("");
  const [filterStatus, setFilterStatus] = React.useState("all");
  const [vendorSearch, setVendorSearch] = React.useState("");

  // export selection
  const [exportMode, setExportMode] = React.useState(false);
  const [exportSelected, setExportSelected] = React.useState([]);
  const [exportProject, setExportProject] = React.useState("");

  // image uploading state
  const [uploadingImage, setUploadingImage] = React.useState(false);

  const latestState = React.useRef({ materials, types, members, vendors });
  React.useEffect(() => {
    latestState.current = { materials, types, members, vendors };
  }, [materials, types, members, vendors]);

  const [syncing, setSyncing] = React.useState(false);
  const isFirstLoad = React.useRef(true);

  // ── 初始載入 ─────────────────────────────────────────────
  React.useEffect(() => {
    // 先從 localStorage 讀取快取，立即顯示
    try {
      const cache = localStorage.getItem("wd-mat-cache");
      if (cache) {
        const { materials: m, types: t, members: mb, vendors: v } = JSON.parse(cache);
        if (m) setMaterials(m);
        if (t) setTypes(t);
        if (mb) setMembers(mb);
        if (v) setVendors(v);
        setLoading(false);
        setSyncing(true);
        loadAll(true); // 靜默更新
        return;
      }
    } catch(e) {}
    loadAll(false);
  }, []);

  async function loadAll(silent = false) {
    if (!silent) setLoading(true);
    else setSyncing(true);
    setError("");
    try {
      const [matRows, typeRows, memberRows, vendorRows] = await Promise.all([
        sheetGet("Materials"),
        sheetGet("Types"),
        sheetGet("Members"),
        sheetGet("Vendors"),
      ]);
      const m = rowsToMaterials(matRows);
      const t = rowsToTypes(typeRows);
      const mb = rowsToMembers(memberRows);
      const v = rowsToVendors(vendorRows);
      setMaterials(m);
      setTypes(t);
      setMembers(mb);
      setVendors(v);
      // 存入快取
      try {
        localStorage.setItem("wd-mat-cache", JSON.stringify({ materials: m, types: t, members: mb, vendors: v }));
      } catch(e) {}
    } catch (e) {
      setError("載入失敗，請確認網路與 GAS 部署設定");
    } finally {
      setLoading(false);
      setSyncing(false);
    }
  }

  // ── 儲存 ─────────────────────────────────────────────────
  async function saveAll(newMaterials, newTypes, newMembers, newVendors) {
    setSaving(true);
    try {
      const saves = [];
      if (newMaterials !== undefined)
        saves.push(sheetPut("Materials", materialsToRows(newMaterials)));
      if (newTypes !== undefined)
        saves.push(sheetPut("Types", typesToRows(newTypes)));
      if (newMembers !== undefined)
        saves.push(sheetPut("Members", membersToRows(newMembers)));
      if (newVendors !== undefined)
        saves.push(sheetPut("Vendors", vendorsToRows(newVendors)));
      await Promise.all(saves);
    } catch (e) {
      setError("儲存失敗：" + e.message);
    } finally {
      setSaving(false);
    }
  }

  // ── 篩選邏輯 ─────────────────────────────────────────────
  const filteredMaterials = React.useMemo(() => {
    let list = materials;
    if (activeTab !== "__all__") list = list.filter((m) => m.typeCode === activeTab);
    if (filterStatus !== "all") list = list.filter((m) => m.status === filterStatus);
    if (searchText.trim()) {
      const q = searchText.trim().toLowerCase();
      list = list.filter(
        (m) =>
          m.name.toLowerCase().includes(q) ||
          m.number.toLowerCase().includes(q) ||
          m.vendor.toLowerCase().includes(q) ||
          (m.project || "").toLowerCase().includes(q) ||
          m.note.toLowerCase().includes(q)
      );
    }
    return list;
  }, [materials, activeTab, filterStatus, searchText]);

  // 所有曾用過的專案名稱（用於自動補全）
  const projectSuggestions = React.useMemo(() => {
    const set = new Set(materials.map((m) => m.project || "").filter(Boolean));
    return [...set].sort();
  }, [materials]);

  // ── 類型管理 ─────────────────────────────────────────────
  function openNewType() {
    setEditType({ code: "", name: "", active: true, isNew: true });
  }

  function saveType(t) {
    const { materials: curMats, types: curTypes } = latestState.current;
    const conflict = curTypes.find(
      (x) => x.code === t.code && (!t._origCode || x.code !== t._origCode)
    );
    if (conflict && t.isNew) {
      return alert(`代號「${t.code}」已存在，請更換`);
    }
    let newTypes;
    if (t.isNew) {
      newTypes = [...curTypes, { code: t.code, name: t.name, active: t.active }];
    } else {
      newTypes = curTypes.map((x) =>
        x.code === t._origCode ? { code: t.code, name: t.name, active: t.active } : x
      );
      if (t._origCode !== t.code) {
        const newMats = curMats.map((m) =>
          m.typeCode === t._origCode ? { ...m, typeCode: t.code } : m
        );
        setMaterials(newMats);
        saveAll(newMats, newTypes, undefined, undefined);
        setTypes(newTypes);
        setEditType(null);
        return;
      }
    }
    setTypes(newTypes);
    saveAll(undefined, newTypes, undefined, undefined);
    setEditType(null);
  }

  function deleteType(code) {
    const { materials: curMats, types: curTypes } = latestState.current;
    const inUse = curMats.some((m) => m.typeCode === code);
    if (inUse) return alert("此類型有材料使用中，無法刪除，請先將材料移至其他類型");
    const newTypes = curTypes.filter((t) => t.code !== code);
    setTypes(newTypes);
    saveAll(undefined, newTypes, undefined, undefined);
  }

  function addMember(name) {
    const { members: curMembers } = latestState.current;
    if (curMembers.find((m) => m.name === name)) return alert("此成員已存在");
    const newMembers = [...curMembers, { name, active: true }];
    setMembers(newMembers);
    saveAll(undefined, undefined, newMembers, undefined);
  }

  function deactivateMember(name) {
    const { members: curMembers } = latestState.current;
    const newMembers = curMembers.map((m) =>
      m.name === name ? { ...m, active: false } : m
    );
    setMembers(newMembers);
    if (currentUser === name) setCurrentUser(null);
    saveAll(undefined, undefined, newMembers, undefined);
  }

  // ── 材料 CRUD ────────────────────────────────────────────
  function openNewMaterial() {
    const tc = activeTab === "__all__" ? (types[0] ? types[0].code : "") : activeTab;
    const num = nextNumber(tc, "", materials);
    setEditMaterial({
      isNew: true,
      id: genId(),
      typeCode: tc,
      subCode: "",
      number: tc ? buildNumber(tc, "", num) : "",
      year: new Date().getFullYear().toString(),
      name: "",
      status: "上架",
      vendor: "",
      spec: "",
      image: null,
      note: "",
      project: "",
      createdBy: currentUser || "",
      updatedBy: currentUser || "",
      updatedAt: new Date().toISOString(),
    });
  }

  function openEditMaterial(m) {
    setEditMaterial({ ...m, isNew: false, _origNumber: m.number });
  }

  async function saveMaterial(m) {
    const { materials: curMats } = latestState.current;
    const conflict = curMats.find(
      (x) => x.typeCode === m.typeCode && x.number === m.number && x.id !== m.id
    );
    const now = new Date().toISOString();
    const updated = { ...m, updatedBy: currentUser || m.updatedBy, updatedAt: now };
    delete updated.isNew;
    delete updated._origNumber;
    delete updated._conflict;

    let newMats;
    if (m.isNew) {
      updated.createdBy = currentUser || "";
      newMats = [...curMats, updated];
    } else {
      newMats = curMats.map((x) => (x.id === m.id ? updated : x));
    }

    // 自動同步廠商到名冊
    if (m.vendor && m.vendor.trim()) {
      const { vendors: curVendors } = latestState.current;
      const exists = curVendors.some((v) => v.name === m.vendor.trim());
      if (!exists) {
        const newVendors = [...curVendors, { id: genId(), type: "", name: m.vendor.trim(), contact: "", phone: "", address: "", email: "", line: "", note: "" }];
        setVendors(newVendors);
        setMaterials(newMats);
        await saveAll(newMats, undefined, undefined, newVendors);
        setEditMaterial(null);
        if (conflict) alert(`注意：編號「${m.number}」在此類型中已存在衝突，請至列表排查`);
        return;
      }
    }

    setMaterials(newMats);
    await saveAll(newMats, undefined, undefined, undefined);
    setEditMaterial(null);
    if (conflict) alert(`注意：編號「${m.number}」在此類型中已存在衝突，請至列表排查`);
  }

  function deleteMaterial(id) {
    const { materials: curMats } = latestState.current;
    const newMats = curMats.filter((m) => m.id !== id);
    setMaterials(newMats);
    saveAll(newMats, undefined, undefined, undefined);
  }

  // ── 廠商管理 ─────────────────────────────────────────────
  function saveVendor(v) {
    const { vendors: curVendors } = latestState.current;
    let newVendors;
    if (v.isNew) {

      delete newV.isNew;
      newVendors = [...curVendors, newV];
    } else {
      newVendors = curVendors.map((x) => x.id === v.id ? { ...v } : x);
    }
    setVendors(newVendors);
    saveAll(undefined, undefined, undefined, newVendors);
    setEditVendor(null);
  }

    const newVendors = curVendors.filter((v) => v.id !== id);

  // ── 衝突偵測（編號） ──────────────────────────────────────
  function getNumberConflicts(mats) {
    const counts = {};
    mats.forEach((m) => {
      const key = `${m.typeCode}::${m.number}`;
      counts[key] = (counts[key] || 0) + 1;
    });
    const conflictKeys = new Set(
      Object.entries(counts)
        .filter(([, v]) => v > 1)
        .map(([k]) => k)
    );
    return conflictKeys;
  }

  const conflictKeys = React.useMemo(
    () => getNumberConflicts(materials),
    [materials]
  );

  // ── 圖片批次下載（ZIP） ───────────────────────────────────
  async function downloadImages() {
    const selected = materials.filter((m) => exportSelected.includes(m.id) && m.image);
    if (!selected.length) return alert("所選材料中沒有圖片");

    const JSZip = window.JSZip;
    if (!JSZip) return alert("ZIP 套件載入失敗，請重新整理後再試");

    const zip = new JSZip();
    const zipName = exportProject ? `whatis_${exportProject}_圖片` : "whatis_材料圖片";
    let failed = 0;

    // 顯示進度
    setSyncing(true);

    await Promise.all(selected.map(async (m) => {
      try {
        const url = `https://drive.google.com/uc?export=download&id=${m.image.fileId}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("fetch failed");
        const blob = await res.blob();
        const ext = m.image.fileName
          ? m.image.fileName.slice(m.image.fileName.lastIndexOf("."))
          : ".jpg";
        zip.file(`${m.number}_${m.name}${ext}`, blob);
      } catch (e) {
        failed++;
      }
    }));

    setSyncing(false);

    if (Object.keys(zip.files).length === 0) {
      return alert("所有圖片下載失敗，可能是 Google Drive 權限問題");
    }

    const content = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = `${zipName}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);

    if (failed > 0) alert(`完成，但有 ${failed} 張圖片下載失敗`);
  }

// ─── 設定 Modal 元件 ─────────────────────────────────────────
function SettingsModal({ themeKey, setThemeKey, theme, onMember, onClose }) {
  // 自訂色系：從 localStorage 讀取或用預設
  const getCustom = () => {
    try {
      const c = localStorage.getItem("wd-mat-custom");
      return c ? JSON.parse(c) : { h: 0, s: 0, l: 97 };
    } catch(e) { return { h: 0, s: 0, l: 97 }; }
  };
  const [custom, setCustom] = React.useState(getCustom);

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => { const k = (n + h / 30) % 12; const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); return Math.round(255 * c).toString(16).padStart(2, "0"); };
    return `#${f(0)}${f(8)}${f(4)}`;
  }

  function applyCustom(c) {
    const { h, s, l } = c;
    const bg = hslToHex(h, s, l);
    const surface = hslToHex(h, s, Math.max(l - 4, 0));
    const border = hslToHex(h, s, Math.max(l - 12, 0));
    const borderLight = hslToHex(h, s, Math.max(l - 7, 0));
    const textL = l > 60 ? 20 : 90;
    const text = hslToHex(h, Math.min(s + 5, 100), textL);
    const textSec = hslToHex(h, Math.max(s - 10, 0), textL + 30);
    const textMuted = hslToHex(h, Math.max(s - 20, 0), textL + 50);
    const accent = hslToHex(h, Math.min(s + 10, 100), textL + 15);
    const accentLight = hslToHex(h, s, Math.max(l - 8, 0));
    const customTheme = { name: "自訂", bg, surface, border, borderLight, text, textSec, textMuted, accent, accentLight };
    THEMES.custom = customTheme;
    localStorage.setItem("wd-mat-custom", JSON.stringify(c));
    setThemeKey("custom");
  }

  const previewBg = hslToHex(custom.h, custom.s, custom.l);

  return (
    <div style={s.modal} onClick={onClose}>
      <div style={{ ...s.modalBox, width: 400, background: theme.bg, color: theme.text }} onClick={(e) => e.stopPropagation()}>
        <div style={{ ...s.modalTitle, color: theme.text }}>設定</div>

        {/* 預設色系 */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ ...s.label, color: theme.textSec }}>預設色系</label>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {Object.entries(THEMES).filter(([k]) => k !== "custom").map(([key, t]) => (
              <div key={key} onClick={() => setThemeKey(key)}
                style={{ padding: "10px 14px", borderRadius: 4, border: `1px solid ${themeKey === key ? theme.accent : theme.border}`, cursor: "pointer", background: t.bg, color: t.text, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 14, height: 14, borderRadius: "50%", background: t.accent, flexShrink: 0 }} />
                {t.name}
                {themeKey === key && <span style={{ marginLeft: "auto", fontSize: 11, color: t.accent }}>✓</span>}
              </div>
            ))}
          </div>
        </div>

        {/* 自訂色系 */}
        <div style={{ paddingTop: 16, borderTop: `1px solid ${theme.borderLight}`, marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <label style={{ ...s.label, marginBottom: 0, color: theme.textSec }}>自訂色系</label>
            <div style={{ width: 28, height: 28, borderRadius: 4, background: previewBg, border: `1px solid ${theme.border}` }} />
          </div>
          {[
            { label: "色相 Hue", key: "h", min: 0, max: 360, unit: "°" },
            { label: "飽和度 Saturation", key: "s", min: 0, max: 60, unit: "%" },
            { label: "明度 Lightness", key: "l", min: 70, max: 100, unit: "%" },
          ].map(({ label, key, min, max, unit }) => (
            <div key={key} style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: theme.textSec, marginBottom: 4 }}>
                <span>{label}</span>
                <span>{custom[key]}{unit}</span>
              </div>
              <input type="range" min={min} max={max} value={custom[key]}
                onChange={(e) => setCustom((p) => ({ ...p, [key]: Number(e.target.value) }))}
                style={{ width: "100%", accentColor: theme.accent }} />
            </div>
          ))}
          <button style={{ ...s.btnPrimary, width: "100%", textAlign: "center" }} onClick={() => applyCustom(custom)}>
            套用自訂色系
          </button>
        </div>

        {/* 成員管理 */}
        <div style={{ paddingTop: 16, borderTop: `1px solid ${theme.borderLight}` }}>
          <button style={{ ...s.btnSecondary, borderColor: theme.border, color: theme.text, width: "100%", textAlign: "left" }}
            onClick={onMember}>
            成員管理
          </button>
        </div>

        <div style={{ textAlign: "right", marginTop: 16 }}>
          <button style={{ ...s.btnSecondary, borderColor: theme.border, color: theme.text }} onClick={onClose}>關閉</button>
        </div>
      </div>
    </div>
  );
}

// ─── 材料編輯 Modal 元件 ─────────────────────────────────────
function MaterialModal({ material, types, materials, vendors, onSave, onClose, uploadingImage, setUploadingImage, currentUser, projectSuggestions }) {
  const [form, setForm] = React.useState({ ...material });
  const [imagePreview, setImagePreview] = React.useState(material.image || null);

  function set(key, val) {
    setForm((p) => {
      const next = { ...p, [key]: val };
      if (key === "typeCode" || key === "subCode") {
        const tc = key === "typeCode" ? val : p.typeCode;
        const sc = key === "subCode" ? val : p.subCode;
        const num = nextNumber(tc, sc, materials.filter((m) => m.id !== material.id));
        next.number = tc ? buildNumber(tc, sc, num) : "";
      }
      return next;
    });
  }

  async function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) return alert("圖片請勿超過 10MB");
    setUploadingImage(true);
    try {
      const result = await uploadImage(file);
      if (result.success) {
        setForm((p) => ({ ...p, image: result }));
        setImagePreview(result);
      } else {
        alert("上傳失敗：" + (result.error || "未知錯誤"));
      }
    } catch (e) {
      alert("上傳失敗：" + e.message);
    } finally {
      setUploadingImage(false);
    }
  }

  async function handleRemoveImage() {
    if (!form.image) return;
    if (!window.confirm("確認刪除圖片？")) return;
    try { await deleteImage(form.image.fileId); } catch (e) {}
    setForm((p) => ({ ...p, image: null }));
    setImagePreview(null);
  }

  const isDuplicate = materials.some(
    (m) => m.typeCode === form.typeCode && m.number === form.number && m.id !== form.id
  );

  const vendorNames = [...new Set(vendors.map((v) => v.name).filter(Boolean))];

  return (
    <div style={s.modal} onClick={onClose}>
      <div style={s.modalBox} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalTitle}>{material.isNew ? "新增材料" : "編輯材料"}</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "14px 20px" }}>
          {/* 類型 */}
          <div>
            <label style={s.label}>類型 *</label>
            <select style={s.input} value={form.typeCode} onChange={(e) => set("typeCode", e.target.value)}>
              <option value="">請選擇</option>
              {types.map((t) => (<option key={t.code} value={t.code}>{t.name}（{t.code}）</option>))}
            </select>
          </div>
          {/* 次要項目 */}
          <div>
            <label style={s.label}>次要項目（選填，影響編號）</label>
            <input style={s.input} value={form.subCode || ""} onChange={(e) => set("subCode", e.target.value)} placeholder="例如 A、B、特殊款" />
          </div>
          {/* 編號 */}
          <div style={{ gridColumn: "span 2" }}>
            <label style={s.label}>
              編號 *{" "}
              {isDuplicate && <span style={{ color: G.warning, fontSize: 11 }}>⚠️ 此編號已存在</span>}
            </label>
            <input style={{ ...s.input, borderColor: isDuplicate ? G.warning : undefined }} value={form.number} onChange={(e) => set("number", e.target.value)} placeholder="例如 WD-V-001" />
          </div>
          {/* 名稱 */}
          <div style={{ gridColumn: "span 2" }}>
            <label style={s.label}>材質名稱 *</label>
            <input style={s.input} value={form.name} onChange={(e) => set("name", e.target.value)} />
          </div>
          {/* 年份 */}
          <div>
            <label style={s.label}>使用年份</label>
            <input style={s.input} value={form.year} onChange={(e) => set("year", e.target.value)} placeholder="2024" />
          </div>
          {/* 狀態 */}
          <div>
            <label style={s.label}>狀態</label>
            <select style={s.input} value={form.status} onChange={(e) => set("status", e.target.value)}>
              <option value="上架">上架</option>
              <option value="下架">下架</option>
            </select>
          </div>
          {/* 廠商 */}
          <div>
            <label style={s.label}>廠商</label>
            <input style={s.input} value={form.vendor} onChange={(e) => set("vendor", e.target.value)} list="vendor-list" />
            <datalist id="vendor-list">
              {vendorNames.map((n) => <option key={n} value={n} />)}
            </datalist>
          </div>
          {/* 規格 */}
          <div>
            <label style={s.label}>規格尺寸</label>
            <input style={s.input} value={form.spec} onChange={(e) => set("spec", e.target.value)} placeholder="例如 1220×2440mm" />
          </div>
          {/* 專案 */}
          <div style={{ gridColumn: "span 2" }}>
            <label style={s.label}>使用專案（選填）</label>
            <input style={s.input} value={form.project || ""} onChange={(e) => set("project", e.target.value)} placeholder="輸入專案名稱" list="project-list-modal" />
            <datalist id="project-list-modal">
              {(projectSuggestions || []).map((p) => <option key={p} value={p} />)}
            </datalist>
          </div>
          {/* 備註 */}
          <div style={{ gridColumn: "span 2" }}>
            <label style={s.label}>備註</label>
            <textarea style={{ ...s.input, height: 64, resize: "vertical" }} value={form.note} onChange={(e) => set("note", e.target.value)} />
          </div>
          {/* 圖片上傳 */}
          <div style={{ gridColumn: "span 2" }}>
            <label style={s.label}>材料圖片</label>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              {imagePreview ? (
                <>
                  <div style={{ width: 72, height: 72, borderRadius: 4, overflow: "hidden", border: `1px solid ${G.border}`, flexShrink: 0 }}>
                    <img src={imagePreview.thumbUrl || imagePreview.viewUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <span style={{ fontSize: 12, color: G.textSec }}>{imagePreview.fileName || "已上傳"}</span>
                    <button style={{ ...s.btnDanger, padding: "4px 10px", fontSize: 12 }} onClick={handleRemoveImage}>移除圖片</button>
                  </div>
                </>
              ) : (
                <label style={{ ...s.btnSecondary, cursor: "pointer", display: "inline-block", opacity: uploadingImage ? 0.5 : 1 }}>
                  {uploadingImage ? "上傳中…" : "選擇圖片"}
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={handleImageUpload} disabled={uploadingImage} />
                </label>
              )}
            </div>
          </div>
        </div>
        <div style={{ ...s.row, justifyContent: "flex-end", marginTop: 24, gap: 8 }}>
          <button style={s.btnSecondary} onClick={onClose}>取消</button>
          <button style={s.btnPrimary} onClick={() => {
            if (!form.typeCode) return alert("請選擇類型");
            if (!form.number) return alert("請填寫編號");
            if (!form.name) return alert("請填寫材質名稱");
            onSave(form);
          }}>{material.isNew ? "新增" : "儲存"}</button>
        </div>
      </div>
    </div>
  );
}

            />
            <div style={{ fontSize: 11, color: G.textMuted, marginTop: 4 }}>
              材料編號將自動以此代號為前綴，例如：{form.code || "XX"}-001
            </div>
          </div>
          <div>
            <label style={s.label}>狀態</label>
            <select
              style={s.input}
              value={form.active ? "active" : "inactive"}
              onChange={(e) => setForm((p) => ({ ...p, active: e.target.value === "active" }))}
            >
              <option value="active">啟用</option>
              <option value="inactive">停用</option>
            </select>
          </div>
        </div>
        <div style={{ ...s.row, justifyContent: "flex-end", marginTop: 20, gap: 8 }}>
          <button style={s.btnSecondary} onClick={onClose}>
            取消
          </button>
          <button
            style={s.btnPrimary}
            onClick={() => {
              if (!form.name) return alert("請填寫類型名稱");
              if (!form.code) return alert("請填寫代號");
              onSave(form);
            }}
          >
            {type.isNew ? "新增" : "儲存"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── 成員管理 Modal ──────────────────────────────────────────
function MemberModal({ members, currentUser, onAdd, onDeactivate, onClose }) {
  const [newName, setNewName] = React.useState("");
  return (
    <div style={s.modal} onClick={onClose}>
      <div style={s.modalBox} onClick={(e) => e.stopPropagation()}>
        <div style={s.modalTitle}>成員管理</div>
        <table style={s.tableWrap}>
          <thead>
            <tr>
              <th style={s.th}>姓名</th>
              <th style={s.th}>狀態</th>
              <th style={s.th}></th>
            </tr>
          </thead>
          <tbody>
            {members.map((m) => (
              <tr key={m.name}>
                <td style={s.td}>
                  {m.name}
                  {m.name === currentUser && (
                    <span style={{ ...s.tag("gray"), marginLeft: 6 }}>目前使用者</span>
                  )}
                </td>
                <td style={s.td}>
                  <span style={s.tag(m.active ? "green" : "gray")}>
                    {m.active ? "啟用" : "停用"}
                  </span>
                </td>
                <td style={s.td}>
                  {m.active && (
                    <button
                      style={{ ...s.btnDanger, padding: "4px 10px", fontSize: 12 }}
                      onClick={() => onDeactivate(m.name)}
                    >
                      停用（需管理員）
                    </button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${G.borderLight}` }}>
          <label style={s.label}>新增成員</label>
          <div style={{ ...s.row, gap: 8 }}>
            <input
              style={{ ...s.input, flex: 1 }}
              placeholder="輸入姓名"
              value={newName}
              onChange={(e) => setNewName(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && newName.trim()) {
                  onAdd(newName.trim());
                  setNewName("");
                }
              }}
            />
            <button
              style={s.btnPrimary}
              onClick={() => {
                if (newName.trim()) {
                  onAdd(newName.trim());
                  setNewName("");
                }
              }}
            >
              新增
            </button>
          </div>
        </div>
        <div style={{ textAlign: "right", marginTop: 16 }}>
          <button style={s.btnSecondary} onClick={onClose}>
            關閉
          </button>
        </div>
      </div>
    </div>
  );
}


    const domRoot = ReactDOM.createRoot(document.getElementById("root"));
    domRoot.render(React.createElement(App));
  </script>
</body>
